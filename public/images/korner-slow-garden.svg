      <path d="M487 218C492 180 493 139 505 105M488 213C475 179 466 156 453 137M489 216C510 182 533 158 560 149M491 214C518 203 541 194 559 180M489 216C480 178 480 143 479 117M489 215C509 174 526 149 535 119" />
      <path d="M474 189L463 185M506 187L519 184M492 170L487 158M518 159L530 155" />
    </g>

