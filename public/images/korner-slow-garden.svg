      <path d="M216 201L181 194M215 207L175 207M216 213L184 221M260 201L291 191M261 208L298 205M260 214L288 221" stroke-width="1.7" />
    </g>
    <g fill="var(--garden-stripe, #8f5339)" stroke="none">
      <circle cx="219" cy="201" r="1.4" /><circle cx="222" cy="207" r="1.4" />
      <circle cx="254" cy="202" r="1.4" /><circle cx="252" cy="208" r="1.4" />
    </g>

    <!-- The cup's generous bowl and hand-painted, contour-following glaze. -->
    <path d="M181 231C186 288 207 329 268 346C290 353 345 354 368 346C421 328 446 286 451 231C426 251 212 253 181 231Z" fill="var(--garden-cup, #f6efda)" stroke-width="3.5" />
    <path d="M186 256C246 278 390 278 446 254L440 276C379 298 252 296 192 275Z" fill="var(--garden-leaf, #315b43)" stroke="none" />
    <path d="M204 302C268 322 370 324 427 300L416 317C364 336 274 335 218 318Z" fill="var(--garden-cat, #dc9969)" stroke="none" />
    <path d="M184 241C242 264 391 265 448 241M198 287C256 308 380 310 435 287" stroke-width="1.5" />
    <path d="M266 347L264 356C290 367 345 366 370 355L367 347" fill="var(--garden-cup, #f6efda)" stroke-width="3" />
    <path d="M276 355C302 360 335 360 359 354" stroke-width="1.3" />
    <g stroke-width="1.2" opacity=".45">
      <path d="M204 267L210 279M219 271L224 283M234 274L238 286M249 277L252 288M265 279L267 290M281 281L282 291M298 282L298 292M315 282L315 293M332 282L332 292M349 281L348 291M365 279L364 290M381 277L379 288M397 273L394 285M412 270L409 281M427 265L423 278" stroke="var(--garden-paper, #fff9e9)" />
    </g>

    <!-- One paw drapes over the rim, tying the figure to its resting place. -->
    <path d="M229 225C238 222 251 225 256 231C261 237 261 250 255 254C248 261 235 257 230 252C224 245 223 232 229 225Z" fill="var(--garden-cat, #dc9969)" stroke-width="2.8" />
    <path d="M237 245L239 253M245 244L247 254" stroke-width="1.6" />

    <!-- A quiet companion resting on the cup handle. -->
    <g stroke-width="2.5">
      <path d="M494 231L490 239M503 232L501 240" />
      <path d="M476 211C481 217 487 218 491 216C488 205 491 190 502 188C512 186 519 194 517 205C517 217 508 230 496 231C484 232 475 225 470 213Z" fill="var(--garden-paper, #fff9e9)" />
      <path d="M492 209C495 200 505 202 510 209C509 218 501 223 495 220Z" fill="var(--garden-leaf-light, #aebfa1)" stroke-width="1.7" />
      <path d="M517 197L527 202L516 205" fill="var(--garden-cat, #dc9969)" stroke-width="1.7" />
      <circle cx="509" cy="196" r="1.8" fill="var(--garden-ink, #234437)" stroke="none" />
