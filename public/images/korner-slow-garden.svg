    <path d="M191 181L185 141C184 132 190 130 196 134L221 150C230 146 241 145 251 149L277 131C285 126 290 130 288 139L284 179C293 190 294 205 287 217C278 233 255 241 232 236C207 232 190 219 188 201C187 193 189 186 191 181Z" fill="var(--garden-cat, #dc9969)" stroke-width="3.4" />
    <path d="M194 144L200 174L213 158Z" fill="var(--garden-stripe, #8f5339)" stroke="none" />
    <path d="M279 141L260 158L276 171Z" fill="var(--garden-stripe, #8f5339)" stroke="none" />
    <path d="M226 151L231 167M239 149L240 162M252 153L248 167" stroke="var(--garden-stripe, #8f5339)" stroke-width="5" />
    <path d="M208 205C207 194 221 190 237 199C251 190 267 195 269 205C271 222 249 230 236 224C222 228 208 219 208 205Z" fill="var(--garden-cup, #f6efda)" stroke="none" />
