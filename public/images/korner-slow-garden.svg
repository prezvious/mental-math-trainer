      <path d="M480 220C458 205 434 187 432 160C431 143 439 132 450 128C451 113 462 103 476 105C483 87 499 83 510 96C524 85 541 92 543 108C561 109 572 126 566 141C584 152 582 174 566 184C562 204 530 217 502 218L489 231Z" fill="var(--garden-leaf, #315b43)" />
