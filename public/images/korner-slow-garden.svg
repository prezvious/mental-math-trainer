      <path d="M114 170C98 144 101 111 120 89C137 119 132 148 114 170Z" fill="var(--garden-leaf, #315b43)" />
      <path d="M141 256C135 218 150 186 181 174C189 205 175 240 141 256Z" fill="var(--garden-leaf, #315b43)" />
      <path d="M155 295C124 297 100 281 87 256C118 251 148 266 155 295Z" fill="var(--garden-leaf-light, #aebfa1)" />
      <path d="M159 312C154 284 169 259 193 247C201 274 185 301 159 312Z" fill="var(--garden-leaf-light, #aebfa1)" />
    </g>
    <g stroke-width="1.5">
