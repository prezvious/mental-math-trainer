    <path d="M83 330C111 306 187 308 240 312C317 318 337 304 408 311C466 316 548 316 568 342C593 374 520 392 438 390C359 388 308 405 229 395C160 385 54 378 83 330Z" fill="var(--garden-ground, #e6ece2)" stroke="none" />
