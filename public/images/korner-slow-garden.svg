<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <title>Slow Garden</title>
  <desc>An original botanical daydream: a sleeping striped cat in a ceramic cup, a small bird, broad leaves, and a low afternoon sun.</desc>

  <!-- Low sun and its quiet, engraved contours. -->
  <g stroke="var(--garden-ink, #234437)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M319 162C303 123 322 69 364 49C409 27 465 47 482 88C498 129 473 173 431 186Z" fill="var(--garden-sun, #efc78a)" stroke="none" />
    <g stroke-width="1.5" opacity=".27">
      <path d="M334 123C346 82 390 58 431 71M333 137C349 92 395 71 440 84M340 148C359 111 399 92 447 99M351 157C374 126 411 113 451 115M367 165C387 145 416 135 448 134" />
    </g>

