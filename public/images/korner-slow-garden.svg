    <!-- A ginkgo sprig and a fallen petal finish the foreground. -->
    <g stroke-width="2.2">
      <path d="M152 352C136 338 120 326 103 317" />
      <path d="M117 328C117 308 105 296 88 299C84 287 69 287 63 296C50 291 42 302 48 313C43 325 57 333 68 329C86 339 101 340 117 328Z" fill="var(--garden-cat, #dc9969)" />
      <path d="M115 328L68 302M112 328L56 313M111 329L72 325M113 326L91 305" stroke-width="1.2" />
      <path d="M378 374C386 361 402 359 412 366C402 380 389 383 378 374Z" fill="var(--garden-cat, #dc9969)" />
      <path d="M382 374L405 366" stroke-width="1.2" />
    </g>
    <path d="M173 365C184 360 195 361 203 365M327 386C340 382 352 382 365 383" stroke-width="1.5" opacity=".6" />
  </g>
</svg>
